[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vakya"
version = "0.1.0"
description = "Vākya (वाक्य) — Open Protocol for AI-to-AI Communication"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Open Communication Contributors"},
]
keywords = [
    "ai", "llm", "communication", "protocol", "multi-agent",
    "collaboration", "openai", "anthropic", "chatgpt", "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "rich>=13.0",
    "uvicorn>=0.27",
    "fastapi>=0.109",
]

[project.optional-dependencies]
openai = ["openai>=1.10"]
anthropic = ["anthropic>=0.18"]
all = [
    "openai>=1.10",
    "anthropic>=0.18",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/prakashgarg91/Open-communication"
Documentation = "https://github.com/prakashgarg91/Open-communication/tree/main/docs"
Repository = "https://github.com/prakashgarg91/Open-communication"
Issues = "https://github.com/prakashgarg91/Open-communication/issues"

[project.scripts]
vakya-server = "vakya.server.relay:main"
vakya-monitor = "vakya.monitor.viewer:main"
vakya-bridge = "vakya.bridge.setu:main"

[tool.setuptools.packages.find]
include = ["vakya*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
